<section id="experience" class="experience-section section-spacing">
  <div class="container-lg">
    <div class="section-header">
      <div class="section-accent-line"></div>
      <h2 class="section-title">
        <span class="keyword">let</span> <span class="string">experience</span> =
      </h2>
      <p class="section-subtitle">6+ years of professional development and system integration</p>
    </div>

    <div class="experience-timeline">
      <div
        *ngFor="let exp of experiences; let i = index"
        class="experience-card"
        [class.current]="exp.current"
      >
        <div class="card-header-section">
          <div class="company-info">
            <h3 class="company-name">{{ exp.company }}</h3>
            <p class="job-title">{{ exp.title }}</p>
          </div>
          <div class="meta-info">
            <span [class]="'badge badge-' + exp.type">
              {{ getTypeLabel(exp.type) }}
            </span>
            <span class="location" *ngIf="exp.location">📍 {{ exp.location }}</span>
          </div>
        </div>

        <div class="card-body-section">
          <p class="period">{{ exp.period }}</p>

          <div class="responsibilities">
            <h4>Key Responsibilities</h4>
            <ul>
              <li *ngFor="let resp of exp.responsibilities" class="responsibility-item">
                {{ resp }}
              </li>
            </ul>
          </div>

          <div class="technologies">
            <h4>Technologies</h4>
            <div class="tech-stack">
              <span class="tech-tag" *ngFor="let tech of exp.technologies">
                {{ tech }}
              </span>
            </div>
          </div>

          <div class="current-indicator" *ngIf="exp.current">
            <span class="pulse"></span>
            Currently employed
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
