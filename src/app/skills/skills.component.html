<section id="skills" class="skills-section section-spacing">
  <div class="container-lg">
    <div class="section-header">
      <div class="section-accent-line"></div>
      <h2 class="section-title">
        <span class="keyword">const</span> <span class="string">skills</span> =
      </h2>
      <p class="section-subtitle">Comprehensive technical expertise across full-stack development</p>
    </div>

    <div class="skills-grid">
      <div
        *ngFor="let category of skillCategories; let i = index"
        class="skill-category"
      >
        <div class="category-header" [style.border-left-color]="category.color">
          <span class="category-icon">{{ category.icon }}</span>
          <h3 class="category-name">{{ category.name }}</h3>
        </div>

        <div class="skills-list">
          <span
            *ngFor="let skill of category.skills; let j = index"
            class="skill-item"
            [style.--skill-color]="category.color"
          >
            <span class="skill-dot"></span>
            {{ skill }}
          </span>
        </div>
      </div>
    </div>

    <div class="skills-highlight">
      <h3>Primary Expertise</h3>
      <p>
        <span class="highlight-badge" style="color: #EF4444;">Java & Spring Boot</span>
        <span class="highlight-badge" style="color: #F97316;">Angular</span>
        <span class="highlight-badge" style="color: #FBBF24;">Oracle SQL</span>
        <span class="highlight-badge" style="color: #06B6D4;">Full-Stack Development</span>
      </p>
    </div>
  </div>
</section>
